[project]
name = "logsage"
version = "0.1.0"
description = "AI log triage and incident tracker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "openai>=1.57",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "cd frontend && npm ci && npm run build"

[tool.vercel.fastapi.static]
cdn = true
